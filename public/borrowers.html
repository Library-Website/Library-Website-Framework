<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Học sinh đang mượn sách</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="logo.css" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
  <style>
    body { background: #f5f7fa; }
    .topbar { background: #1f3a5f; color: #fff; padding: 1rem; }
    .topbar h1 { font-size: 1.3rem; font-weight: 700; margin: 0; }
    .section-card { border: 0; border-radius: .75rem; box-shadow: 0 2px 8px rgba(0,0,0,.07); }
    .stat { font-size: 1.6rem; font-weight: 700; line-height: 1.1; }
    tr.overdue td { background: #fff1f1; }
    @media print {
      .topbar, .no-print, #pager { display: none !important; }
      body { background: #fff; }
      .section-card { box-shadow: none; }
    }
  </style>
</head>
<body>

  <header class="topbar on-dark">
    <div class="container d-flex flex-wrap justify-content-between align-items-center gap-2">
      <div class="logo" role="img" aria-label="Logo CLB Thư viện"></div>
      <h1>Học sinh đang mượn sách</h1>
      <a href="admin.html" class="btn btn-outline-light btn-sm no-print">← Quay lại quản trị</a>
    </div>
  </header>

  <main class="container py-4">

    <!-- Summary -->
    <div class="row g-3 mb-3">
      <div class="col-6 col-md-3">
        <div class="card section-card"><div class="card-body">
          <div class="stat" id="stat-students">0</div>
          <div class="text-muted small">Học sinh đang mượn</div>
        </div></div>
      </div>
      <div class="col-6 col-md-3">
        <div class="card section-card"><div class="card-body">
          <div class="stat" id="stat-loans">0</div>
          <div class="text-muted small">Lượt mượn (cuốn)</div>
        </div></div>
      </div>
      <div class="col-6 col-md-3">
        <div class="card section-card"><div class="card-body">
          <div class="stat text-danger" id="stat-overdue">0</div>
          <div class="text-muted small">Quá hạn trả</div>
        </div></div>
      </div>
      <div class="col-6 col-md-3">
        <div class="card section-card"><div class="card-body">
          <div class="stat" id="stat-soon">0</div>
          <div class="text-muted small">Đến hạn trong 3 ngày</div>
        </div></div>
      </div>
    </div>

    <!-- Filters -->
    <div class="row g-2 mb-3 no-print">
      <div class="col-12 col-md-5">
        <input id="search" type="search" class="form-control" placeholder="Tìm theo tên học sinh, lớp, tên sách, mã vạch..." autocomplete="off">
      </div>
      <div class="col-6 col-md-2">
        <select id="class-filter" class="form-select">
          <option value="">Tất cả lớp</option>
        </select>
      </div>
      <div class="col-6 col-md-2">
        <select id="status-filter" class="form-select">
          <option value="">Mọi tình trạng</option>
          <option value="overdue">Quá hạn</option>
          <option value="ok">Chưa quá hạn</option>
        </select>
      </div>
      <div class="col-6 col-md-2">
        <select id="sort" class="form-select">
          <option value="due">Sắp xếp: hạn trả</option>
          <option value="name">Sắp xếp: tên học sinh</option>
          <option value="class">Sắp xếp: lớp</option>
          <option value="borrowed">Sắp xếp: ngày mượn</option>
        </select>
      </div>
      <div class="col-6 col-md-1 d-grid">
        <button id="print-btn" class="btn btn-outline-secondary" title="In danh sách">In</button>
      </div>
    </div>

    <!-- Table -->
    <div class="card section-card">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th>Học sinh</th>
              <th>Lớp</th>
              <th>Sách</th>
              <th>Mã vạch</th>
              <th>Ngày mượn</th>
              <th>Hạn trả</th>
              <th>Tình trạng</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
    <p id="status-msg" class="text-center text-muted mt-4">Đang tải...</p>
    <nav id="pager" class="mt-4" aria-label="Chuyển trang"></nav>
  </main>

  <script src="data.js"></script>
  <script src="categories.js"></script>
  <script>
    // Only the signed-in librarian can see this page (borrower names are private).
    const rowsEl = document.getElementById("rows");
    const msgEl = document.getElementById("status-msg");
    const searchEl = document.getElementById("search");
    const classEl = document.getElementById("class-filter");
    const statusEl = document.getElementById("status-filter");
    const sortEl = document.getElementById("sort");
    const pagerEl = document.getElementById("pager");
    let loans = [];
    let currentPage = 1;

    firebaseReady.then(({ auth }) => {
      auth.onAuthStateChanged(user => {
        if (!user) window.location.replace("admin.html");
        else load();
      });
    });

    // Whole days from today to a YYYY-MM-DD date (negative = already past). null if no date.
    function daysUntil(dateStr) {
      if (!dateStr) return null;
      const [y, m, d] = dateStr.split("-").map(Number);
      const t = new Date();
      const today = new Date(t.getFullYear(), t.getMonth(), t.getDate());
      return Math.round((new Date(y, m - 1, d) - today) / 86400000);
    }

    // 2026-11-10 -> 10/11/2026
    function fmtDate(s) {
      if (!s) return "";
      const [y, m, d] = s.split("-");
      return d + "/" + m + "/" + y;
    }

    async function load() {
      msgEl.textContent = "Đang tải...";
      msgEl.classList.remove("d-none");
      const books = await loadBooks();
      if (booksLoadFailed) {
        msgEl.textContent = "Không tải được dữ liệu. Hãy kiểm tra mạng rồi tải lại trang.";
        return;
      }
      if (!(store && store.hasBorrowers)) {
        msgEl.textContent = "Tài khoản này không có quyền xem danh sách người mượn.";
        return;
      }
      loans = [];
      for (const b of books) {
        for (const br of b.borrowers || []) {
          const d = (b.details || {})[br.barcode] || {};
          loans.push({
            name: br.name || "(chưa nhập tên)",
            cls: br.class || "",
            title: b.name,
            barcode: br.barcode || "",
            reg: d.reg || "",
            borrowed: br.borrowed || "",
            due: br.due || "",
            days: daysUntil(br.due)
          });
        }
      }

      // Class dropdown from the data, sorted naturally (6A2 before 6A10).
      const classes = [...new Set(loans.map(l => l.cls).filter(Boolean))]
        .sort((a, b) => a.localeCompare(b, "vi", { numeric: true }));
      classEl.innerHTML = '<option value="">Tất cả lớp</option>' +
        classes.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join("");

      // Summary cards
      const students = new Set(loans.map(l => normalizeText(l.name) + "|" + normalizeText(l.cls)));
      document.getElementById("stat-students").textContent = students.size;
      document.getElementById("stat-loans").textContent = loans.length;
      document.getElementById("stat-overdue").textContent = loans.filter(l => l.days !== null && l.days < 0).length;
      document.getElementById("stat-soon").textContent = loans.filter(l => l.days !== null && l.days >= 0 && l.days <= 3).length;

      render();
    }

    function statusBadge(l) {
      if (l.days === null) return '<span class="badge text-bg-light border">Chưa có hạn trả</span>';
      if (l.days < 0) return `<span class="badge text-bg-danger">Quá hạn ${-l.days} ngày</span>`;
      if (l.days === 0) return '<span class="badge text-bg-warning">Hết hạn hôm nay</span>';
      if (l.days <= 3) return `<span class="badge text-bg-warning">Còn ${l.days} ngày</span>`;
      return `<span class="badge text-bg-success">Còn ${l.days} ngày</span>`;
    }

    function render() {
      const q = normalizeText(searchEl.value.trim());
      const cls = classEl.value;
      const st = statusEl.value;
      const sortBy = sortEl.value;

      let list = loans.filter(l => {
        if (cls && l.cls !== cls) return false;
        if (st === "overdue" && !(l.days !== null && l.days < 0)) return false;
        if (st === "ok" && (l.days !== null && l.days < 0)) return false;
        if (!q) return true;
        return normalizeText([l.name, l.cls, l.title, l.barcode, l.reg].join(" ")).includes(q);
      });

      const byText = (a, b) => a.localeCompare(b, "vi", { numeric: true });
      // Empty dates go last.
      const byDate = (a, b) => !a && !b ? 0 : !a ? 1 : !b ? -1 : a.localeCompare(b);
      list.sort((a, b) => {
        if (sortBy === "name") return byText(a.name, b.name);
        if (sortBy === "class") return byText(a.cls, b.cls) || byText(a.name, b.name);
        if (sortBy === "borrowed") return byDate(a.borrowed, b.borrowed);
        return byDate(a.due, b.due) || byText(a.name, b.name);
      });

      const pg = paginate(list, currentPage);
      currentPage = pg.page;
      rowsEl.innerHTML = pg.items.map(l => `
        <tr class="${l.days !== null && l.days < 0 ? "overdue" : ""}">
          <td class="fw-semibold">${escapeHtml(l.name)}</td>
          <td>${escapeHtml(l.cls)}</td>
          <td>${escapeHtml(l.title)}</td>
          <td class="font-monospace small">${escapeHtml(l.barcode)}</td>
          <td>${escapeHtml(fmtDate(l.borrowed))}</td>
          <td>${escapeHtml(fmtDate(l.due))}</td>
          <td>${statusBadge(l)}</td>
        </tr>`).join("");

      const filtering = q || cls || st;
      msgEl.textContent = loans.length === 0
        ? "Hiện chưa có học sinh nào đang mượn sách."
        : (filtering && list.length === 0 ? "Không tìm thấy kết quả." : "");
      msgEl.classList.toggle("d-none", !msgEl.textContent);

      renderPager(pagerEl, pg.page, pg.totalPages, n => {
        currentPage = n;
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
    }

    [searchEl, classEl, statusEl, sortEl].forEach(el => {
      el.addEventListener(el === searchEl ? "input" : "change", () => { currentPage = 1; render(); });
    });
    document.getElementById("print-btn").addEventListener("click", () => window.print());
  </script>
</body>
</html>
