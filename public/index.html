<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thư viện</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f5f7fa; }
    .hero {background: #1f3a5f; color: #fff; padding: 2.5rem 1rem 3.5rem; text-align: center; }
    .hero h1 { font-size: 1.8rem; font-weight: 700; margin: 0; }
    .hero p { margin: .4rem 0 0; opacity: .8; }
    .login-btn { position: absolute; top: 1rem; right: 1rem; }
    .search-wrap { max-width: 560px; margin: -1.6rem auto 1.5rem; padding: 0 1rem; }
    .search-wrap input { box-shadow: 0 4px 14px rgba(0,0,0,.12); border: 0; }
    .book-card { border: 0; border-radius: .75rem; box-shadow: 0 2px 8px rgba(0,0,0,.07); height: 100%; }
    .book-title { font-weight: 600; font-size: 1.05rem; }
    .copies { font-size: .9rem; color: #5b6573; }
  </style>
</head>
<body>

  <header class="hero">
    <a href="admin.html" class="btn btn-outline-light btn-sm login-btn">Đăng nhập</a>
    <h1 id="school-name">Thư viện trường</h1>
    <p>Tìm sách và xem sách còn hay hết</p>
  </header>

  <div class="search-wrap">
    <input id="search" type="search" class="form-control form-control-lg"
           placeholder="Tìm sách theo tên..." autocomplete="off">
  </div>

  <main class="container pb-5">
    <div id="book-list" class="row g-3"></div>
    <p id="empty" class="text-center text-muted mt-4 d-none">Không tìm thấy sách.</p>
  </main>

  <script src="data.js"></script>
  <script>
    const listEl = document.getElementById("book-list");
    const emptyEl = document.getElementById("empty");
    const searchEl = document.getElementById("search");
    let allBooks = [];

    // Lowercase and strip Vietnamese accents so "de men" finds "Dế Mèn".
    function normalize(s) {
      return s.toLowerCase()
        .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
        .replace(/đ/g, "d");
    }

    function render(books) {
      listEl.innerHTML = books.map(b => {
        const available = b.copies > 0;
        const badge = available
          ? '<span class="badge text-bg-success">Còn sách</span>'
          : '<span class="badge text-bg-secondary">Hết sách</span>';
        return `
          <div class="col-12 col-sm-6 col-lg-4">
            <div class="card book-card">
              <div class="card-body d-flex flex-column gap-2">
                <div class="book-title">${escapeHtml(b.name)}</div>
                <div class="d-flex justify-content-between align-items-center mt-auto">
                  ${badge}
                  <span class="copies">Còn ${b.copies} cuốn</span>
                </div>
              </div>
            </div>
          </div>`;
      }).join("");
      emptyEl.classList.toggle("d-none", books.length > 0);
    }

    function applySearch() {
      const q = normalize(searchEl.value.trim());
      render(allBooks.filter(b => normalize(b.name).includes(q)));
    }

    searchEl.addEventListener("input", applySearch);

    // ---- Local cache (this browser only) ----
    // Only the public part is saved: name and copies left. Never borrowers or student names.
    // The saved copy is shown at once; fresh data is always fetched too and replaces it when it arrives.
    const CACHE_KEY = "library-cache-v1";
    const CACHE_MAX_AGE = 7 * 24 * 60 * 60 * 1000; // older than 7 days: ignored

    function readCache() {
      try {
        const c = JSON.parse(localStorage.getItem(CACHE_KEY));
        if (c && Array.isArray(c.books) && Date.now() - c.time < CACHE_MAX_AGE) return c;
      } catch (e) {}
      return null;
    }

    function writeCache(schoolName, books) {
      try {
        const old = readCache() || {};
        localStorage.setItem(CACHE_KEY, JSON.stringify({
          time: Date.now(),
          schoolName: schoolName !== undefined ? schoolName : old.schoolName,
          books: books !== undefined ? books.map(b => ({ id: b.id, name: b.name, copies: b.copies })) : (old.books || [])
        }));
      } catch (e) { /* storage full or blocked: the page still works without a cache */ }
    }

    function showSchoolName(name) {
      document.title = name;
      document.getElementById("school-name").textContent = name;
    }

    // 1) Show the saved copy immediately (if there is one and it is not too old).
    const cached = readCache();
    let shownJson = null;
    if (cached) {
      if (cached.schoolName) showSchoolName(cached.schoolName);
      allBooks = cached.books;
      shownJson = JSON.stringify(cached.books);
      applySearch();
    }

    // 2) Always fetch fresh data. The school name and the books load at the same time.
    loadSchoolName().then(schoolName => {
      if (schoolNameLoadFailed) return; // keep the saved name instead of the default
      showSchoolName(schoolName);
      writeCache(schoolName, undefined);
    });
    loadBooks().then(books => {
      if (booksLoadFailed) return; // offline or error: keep whatever is on screen
      const slim = books.map(b => ({ id: b.id, name: b.name, copies: b.copies }));
      const json = JSON.stringify(slim);
      writeCache(undefined, slim);
      if (json !== shownJson) { // redraw only if something really changed
        allBooks = slim;
        applySearch();
      }
    });
  </script>
</body>
</html>
