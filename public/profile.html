<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hồ sơ thư viện</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f5f7fa; }
    .topbar { background: #1f3a5f; color: #fff; padding: 1rem; }
    .topbar h1 { font-size: 1.3rem; font-weight: 700; margin: 0; }
    .section-card { border: 0; border-radius: .75rem; box-shadow: 0 2px 8px rgba(0,0,0,.07); }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="container d-flex flex-wrap justify-content-between align-items-center gap-2">
      <h1>Hồ sơ thư viện</h1>
      <a href="admin.html" class="btn btn-outline-light btn-sm">← Quay lại quản trị</a>
    </div>
  </header>

  <main class="container py-4" style="max-width: 640px;">

    <!-- School name (works locally) -->
    <section class="card section-card mb-3">
      <div class="card-body p-4">
        <h2 class="h5 mb-3">Tên trường</h2>
        <form id="school-form">
          <div class="mb-3">
            <label class="form-label" for="school-name-input">Tên hiển thị trên trang chủ</label>
            <input id="school-name-input" class="form-control" maxlength="100" required>
          </div>
          <div class="d-flex align-items-center gap-3">
            <button class="btn btn-primary" type="submit">Lưu tên trường</button>
            <span id="school-saved" class="text-success small d-none">Đã lưu.</span>
          </div>
        </form>
      </div>
    </section>

    <!-- Librarian accounts -->
    <section class="card section-card">
      <div class="card-body p-4">
        <h2 class="h5 mb-2">Tài khoản thủ thư</h2>
        <p class="text-muted small">Các email dưới đây có thể đăng nhập trang quản trị. Muốn đổi email: thêm email mới, đăng nhập thử, rồi xóa email cũ.</p>
        <ul id="librarian-list" class="list-group mb-4"></ul>
        <form id="librarian-form">
          <div class="mb-3">
            <label class="form-label" for="lib-email">Email thủ thư mới</label>
            <input id="lib-email" type="email" class="form-control" placeholder="ten@gmail.com" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="lib-pass">Mật khẩu ban đầu (ít nhất 6 ký tự)</label>
            <input id="lib-pass" type="text" minlength="6" class="form-control" autocomplete="off" required>
          </div>
          <div class="d-flex align-items-center gap-3">
            <button id="lib-add" class="btn btn-primary" type="submit">Thêm thủ thư</button>
            <span id="lib-msg" class="small"></span>
          </div>
        </form>
      </div>
    </section>

    <!-- Change my password -->
    <section class="card section-card mt-3">
      <div class="card-body p-4">
        <h2 class="h5 mb-2">Đổi mật khẩu</h2>
        <p class="text-muted small">Chỉ đổi được mật khẩu của tài khoản đang đăng nhập.</p>
        <form id="password-form">
          <div class="mb-3">
            <label class="form-label" for="pw-old">Mật khẩu hiện tại</label>
            <input id="pw-old" type="password" class="form-control" autocomplete="current-password" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="pw-new">Mật khẩu mới (ít nhất 6 ký tự)</label>
            <input id="pw-new" type="password" minlength="6" class="form-control" autocomplete="new-password" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="pw-new2">Nhập lại mật khẩu mới</label>
            <input id="pw-new2" type="password" minlength="6" class="form-control" autocomplete="new-password" required>
          </div>
          <div class="d-flex align-items-center gap-3">
            <button id="pw-btn" class="btn btn-primary" type="submit">Đổi mật khẩu</button>
            <span id="pw-msg" class="small"></span>
          </div>
        </form>
      </div>
    </section>

  </main>

  <script src="data.js"></script>
  <script>
    // Only the signed-in librarian can see this page (Firebase Authentication, see data.js).
    firebaseReady.then(({ auth }) => {
      auth.onAuthStateChanged(user => { if (!user) window.location.replace("admin.html"); });
    });

    // ---- School name ----
    const nameInput = document.getElementById("school-name-input");
    const savedEl = document.getElementById("school-saved");

    (async function init() {
      const name = await loadSchoolName();
      nameInput.value = name;
      document.title = "Hồ sơ - " + name;
    })();

    document.getElementById("school-form").addEventListener("submit", async e => {
      e.preventDefault();
      await runExclusive(async () => {
        const name = nameInput.value.trim().normalize("NFC");
        if (!name) return;
        try {
          await saveSchoolName(name);
        } catch (err) {
          alert("Không lưu được: " + err.message);
          return;
        }
        nameInput.value = name;
        document.title = "Hồ sơ - " + name;
        savedEl.classList.remove("d-none");
        setTimeout(() => savedEl.classList.add("d-none"), 2500);
      }, { label: "Đang lưu tên trường..." });
    });

    // ---- Librarian accounts ----
    const libListEl = document.getElementById("librarian-list");
    const libMsgEl = document.getElementById("lib-msg");
    let myUid = null;

    function libMessage(text, ok) {
      libMsgEl.textContent = text;
      libMsgEl.className = "small " + (ok ? "text-success" : "text-danger");
    }

    async function renderLibrarians() {
      const items = await listLibrarians();
      libListEl.innerHTML = items.map(x => `
        <li class="list-group-item d-flex justify-content-between align-items-center">
          <span>${escapeHtml(x.email)}${x.uid === myUid ? ' <span class="badge text-bg-secondary">bạn</span>' : ""}</span>
          ${x.uid === myUid ? "" : `<button class="btn btn-outline-danger btn-sm" data-uid="${escapeHtml(x.uid)}" data-email="${escapeHtml(x.email)}">Xóa</button>`}
        </li>`).join("");
    }

    firebaseReady.then(({ auth }) => {
      auth.onAuthStateChanged(async user => {
        if (!user) return;
        myUid = user.uid;
        try {
          await registerSelfAsAdmin();
          await renderLibrarians();
        } catch (err) {
          libMessage("Không tải được danh sách: " + err.message, false);
        }
      });
    });

    libListEl.addEventListener("click", async e => {
      const btn = e.target.closest("button[data-uid]");
      if (!btn) return;
      await runExclusive(async () => {
        if (!confirm("Xóa quyền của " + btn.dataset.email + "?")) return;
        try {
          await removeLibrarian(btn.dataset.uid);
          await renderLibrarians();
          libMessage("Đã xóa.", true);
        } catch (err) {
          libMessage("Không xóa được: " + err.message, false);
        }
      }, { label: "Đang xóa thủ thư..." });
    });

    document.getElementById("librarian-form").addEventListener("submit", async e => {
      e.preventDefault();
      const email = document.getElementById("lib-email").value.trim();
      const pass = document.getElementById("lib-pass").value;
      await runExclusive(async () => {
        libMessage("Đang thêm...", true);
        try {
          await addLibrarian(email, pass);
          document.getElementById("librarian-form").reset();
          await renderLibrarians();
          libMessage("Đã thêm " + email + ". Hãy gửi mật khẩu cho người đó.", true);
        } catch (err) {
          const known = {
            "auth/weak-password": "Mật khẩu quá yếu (ít nhất 6 ký tự).",
            "auth/invalid-email": "Email không hợp lệ.",
            "auth/invalid-credential": "Email này đã có tài khoản với mật khẩu khác.",
            "auth/wrong-password": "Email này đã có tài khoản với mật khẩu khác."
          };
          libMessage(known[err.code] || ("Không thêm được: " + err.message), false);
        }
      }, { label: "Đang thêm thủ thư...", button: document.getElementById("lib-add") });
    });

    // ---- Change my password ----
    const pwMsgEl = document.getElementById("pw-msg");
    function pwMessage(text, ok) {
      pwMsgEl.textContent = text;
      pwMsgEl.className = "small " + (ok ? "text-success" : "text-danger");
    }

    document.getElementById("password-form").addEventListener("submit", async e => {
      e.preventDefault();
      const oldPass = document.getElementById("pw-old").value;
      const newPass = document.getElementById("pw-new").value;
      const newPass2 = document.getElementById("pw-new2").value;
      if (newPass !== newPass2) return pwMessage("Hai mật khẩu mới không giống nhau.", false);
      if (newPass === oldPass) return pwMessage("Mật khẩu mới phải khác mật khẩu cũ.", false);

      await runExclusive(async () => {
        pwMessage("Đang đổi...", true);
        try {
          await changeMyPassword(oldPass, newPass);
          document.getElementById("password-form").reset();
          pwMessage("Đã đổi mật khẩu.", true);
        } catch (err) {
          const known = {
            "auth/wrong-password": "Mật khẩu hiện tại không đúng.",
            "auth/invalid-credential": "Mật khẩu hiện tại không đúng.",
            "auth/weak-password": "Mật khẩu mới quá yếu (ít nhất 6 ký tự).",
            "auth/too-many-requests": "Thử sai quá nhiều lần. Hãy đợi vài phút rồi thử lại."
          };
          pwMessage(known[err.code] || ("Không đổi được: " + err.message), false);
        }
      }, { label: "Đang đổi mật khẩu...", button: document.getElementById("pw-btn") });
    });
  </script>
</body>
</html>
