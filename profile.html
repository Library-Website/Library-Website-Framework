<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hồ sơ thư viện</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f5f7fa; }
    .topbar { background: #1f3a5f; color: #fff; padding: 1rem; }
    .topbar h1 { font-size: 1.3rem; font-weight: 700; margin: 0; }
    .section-card { border: 0; border-radius: .75rem; box-shadow: 0 2px 8px rgba(0,0,0,.07); }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="container d-flex flex-wrap justify-content-between align-items-center gap-2">
      <h1>Hồ sơ thư viện</h1>
      <a href="admin.html" class="btn btn-outline-light btn-sm">← Quay lại quản trị</a>
    </div>
  </header>

  <main class="container py-4" style="max-width: 640px;">

    <!-- School name (works locally) -->
    <section class="card section-card mb-3">
      <div class="card-body p-4">
        <h2 class="h5 mb-3">Tên trường</h2>
        <form id="school-form">
          <div class="mb-3">
            <label class="form-label" for="school-name-input">Tên hiển thị trên trang chủ</label>
            <input id="school-name-input" class="form-control" maxlength="100" required>
          </div>
          <div class="d-flex align-items-center gap-3">
            <button class="btn btn-primary" type="submit">Lưu tên trường</button>
            <span id="school-saved" class="text-success small d-none">Đã lưu.</span>
          </div>
        </form>
      </div>
    </section>

    <!-- Gmail (placeholder: logic comes later) -->
    <section class="card section-card">
      <div class="card-body p-4">
        <h2 class="h5 mb-3">Gmail</h2>
        <form id="gmail-form">
          <div class="mb-3">
            <label class="form-label" for="gmail-current">Gmail hiện tại</label>
            <input id="gmail-current" class="form-control" value="Chưa kết nối" disabled>
          </div>
          <div class="mb-3">
            <label class="form-label" for="gmail-new">Gmail mới</label>
            <input id="gmail-new" type="email" class="form-control" placeholder="ten@gmail.com">
          </div>
          <div class="d-flex align-items-center gap-3">
            <button class="btn btn-outline-primary" type="submit">Đổi Gmail</button>
            <span id="gmail-note" class="text-muted small d-none">Chức năng này sẽ được thêm khi kết nối Firebase.</span>
          </div>
        </form>
      </div>
    </section>

  </main>

  <script src="data.js"></script>
  <script>
    // Only logged-in admins can see this page (same temporary local session as admin.html).
    let loggedIn = false;
    try { loggedIn = sessionStorage.getItem("library_admin_session") === "1"; } catch (e) {}
    if (!loggedIn) {
      window.location.replace("admin.html");
    }

    // ---- School name ----
    const nameInput = document.getElementById("school-name-input");
    const savedEl = document.getElementById("school-saved");

    (async function init() {
      const name = await loadSchoolName();
      nameInput.value = name;
      document.title = "Hồ sơ - " + name;
    })();

    document.getElementById("school-form").addEventListener("submit", async e => {
      e.preventDefault();
      const name = nameInput.value.trim().normalize("NFC");
      if (!name) return;
      await saveSchoolName(name);
      nameInput.value = name;
      document.title = "Hồ sơ - " + name;
      savedEl.classList.remove("d-none");
      setTimeout(() => savedEl.classList.add("d-none"), 2500);
    });

    // ---- Gmail (placeholder) ----
    document.getElementById("gmail-form").addEventListener("submit", e => {
      e.preventDefault();
      // TODO: change the Gmail linked to the Firebase project once Firebase is connected.
      document.getElementById("gmail-note").classList.remove("d-none");
    });
  </script>
</body>
</html>
